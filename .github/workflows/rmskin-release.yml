name: Publish RMSKIN Releases

on:
  push:
    paths:
      - "**/*.rmskin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find RMSKIN files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            FILES=$(find . -type f -name "*.rmskin" -not -path "./.git/*" | sort)
          else
            FILES=$(git diff --name-only --diff-filter=AMR \
              "${{ github.event.before }}" \
              "${{ github.sha }}" -- '*.rmskin')
          fi

          if [[ -z "$FILES" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish RMSKIN Releases
        if: steps.files.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.files.outputs.files }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          IMAGE="Simple_Colorful_Desk_2.0_by_AMiMohammad.png"

          if [[ ! -f "$IMAGE" ]]; then
            IMAGE="Simple_Colorful_Desk_2.0_by_AMiMohammadb.jpg"
          fi

          while IFS= read -r FILE; do
            [[ -z "$FILE" || ! -f "$FILE" ]] && continue

            FILENAME="${FILE##*/}"
            TAG="${FILENAME%.rmskin}"

            TAG=$(printf '%s' "$TAG" | sed -E \
              's/_(by_AMiMohammad|by_AMiShadow|by_Mohammad_Hasib|by_AMiSnake)$//I')

            echo "Publishing: $TAG"

            NOTES=""

            if [[ -f "$IMAGE" ]]; then
              NOTES="![Preview](https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/${IMAGE})"
            fi

            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG" \
                --repo "$REPOSITORY" \
                --title "$TAG" \
                --notes "$NOTES"

              gh release upload "$TAG" "$FILE" \
                --repo "$REPOSITORY" \
                --clobber
            else
              gh release create "$TAG" "$FILE" \
                --repo "$REPOSITORY" \
                --title "$TAG" \
                --notes "$NOTES"
            fi

          done <<< "$FILES"
